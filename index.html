<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChemiCard - 화학식 & 원소기호 단어장</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        /* 3D Card Flip Styles */
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }
        .card-inner {
            transition: transform 0.5s cubic-bezier(0.4, 0.2, 0.2, 1);
        }
        
        /* Custom Scrollbar for list */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen flex flex-col text-slate-800">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-600 to-purple-600 flex items-center gap-2 cursor-pointer" onclick="app.goHome()">
                <i class="fa-solid fa-flask text-blue-600"></i> ChemiCard
            </h1>
            <div id="header-controls" class="hidden">
                <button onclick="app.goHome()" class="text-slate-500 hover:text-slate-800 font-medium text-sm transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-xmark text-lg"></i> 종료
                </button>
            </div>
        </div>
        <!-- Progress Bar -->
        <div id="progress-container" class="h-1 bg-slate-100 hidden">
            <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-500 to-purple-500 w-0 transition-all duration-300"></div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 max-w-3xl mx-auto w-full">

        <section id="screen-home" class="screen active w-full w-full max-w-md">
            <div class="bg-white rounded-3xl shadow-xl p-6 sm:p-8 border border-slate-100">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">학습 설정</h2>
                    <p class="text-slate-500 text-sm">중학교 3학년 화학식 & 원소기호</p>
                </div>

                <div class="space-y-6">
                    <!-- Category Selection -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">범주 선택</label>
                        <div class="grid grid-cols-3 gap-2">
                            <button class="category-btn active border-2 border-blue-500 bg-blue-50 text-blue-700 rounded-xl py-2 font-medium text-sm transition-all" data-value="all">전체</button>
                            <button class="category-btn border-2 border-slate-200 bg-white text-slate-600 hover:border-slate-300 rounded-xl py-2 font-medium text-sm transition-all" data-value="element">원소 기호</button>
                            <button class="category-btn border-2 border-slate-200 bg-white text-slate-600 hover:border-slate-300 rounded-xl py-2 font-medium text-sm transition-all" data-value="formula">화학식</button>
                        </div>
                    </div>

                    <!-- Direction Selection -->
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-2">방향 선택</label>
                        <div class="grid grid-cols-1 gap-2">
                            <button class="direction-btn active border-2 border-purple-500 bg-purple-50 text-purple-700 rounded-xl py-3 font-medium text-sm transition-all flex items-center justify-center gap-2" data-value="ko2en">
                                <span>한글</span> <i class="fa-solid fa-arrow-right text-xs"></i> <span>기호/화학식</span>
                            </button>
                            <button class="direction-btn border-2 border-slate-200 bg-white text-slate-600 hover:border-slate-300 rounded-xl py-3 font-medium text-sm transition-all flex items-center justify-center gap-2" data-value="en2ko">
                                <span>기호/화학식</span> <i class="fa-solid fa-arrow-right text-xs"></i> <span>한글</span>
                            </button>
                            <button class="direction-btn border-2 border-slate-200 bg-white text-slate-600 hover:border-slate-300 rounded-xl py-3 font-medium text-sm transition-all" data-value="mixed">랜덤 혼합</button>
                        </div>
                    </div>
                </div>

                <div class="mt-8 space-y-3">
                    <button onclick="app.start('flashcard')" class="w-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-700 hover:to-blue-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center gap-2 text-lg">
                        <i class="fa-regular fa-clone"></i> 플래시카드 학습
                    </button>
                    <button onclick="app.start('test')" class="w-full bg-gradient-to-r from-purple-600 to-purple-500 hover:from-purple-700 hover:to-purple-600 text-white font-bold py-4 rounded-xl shadow-lg shadow-purple-500/30 transition-all flex items-center justify-center gap-2 text-lg">
                        <i class="fa-solid fa-pencil"></i> 주관식 테스트
                    </button>
                    <button id="btn-study-unknown" onclick="app.start('flashcard', true)" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all hidden items-center justify-center gap-2">
                        <i class="fa-solid fa-rotate-left"></i> 모르는 단어만 재학습 (<span id="unknown-count">0</span>)
                    </button>
                </div>
            </div>
        </section>

        <section id="screen-flashcard" class="screen w-full w-full max-w-md">
            <div class="flex justify-between items-center mb-4 px-2">
                <div class="text-sm font-semibold text-slate-500" id="fc-progress-text">1 / 32</div>
                <div class="text-xs text-slate-400 bg-white px-3 py-1 rounded-full shadow-sm border border-slate-200"><i class="fa-solid fa-hand-pointer mr-1"></i> 탭해서 뒤집기</div>
            </div>

            <!-- Card Container -->
            <div class="perspective-1000 w-full aspect-[4/3] sm:aspect-video md:aspect-[4/3] mb-8 cursor-pointer group" id="flashcard-container" onclick="app.flipCard()">
                <div id="flashcard-inner" class="card-inner relative w-full h-full transform-style-3d shadow-2xl rounded-3xl">
                    <!-- Front -->
                    <div class="absolute w-full h-full backface-hidden bg-white rounded-3xl border border-slate-100 flex flex-col items-center justify-center p-6 text-center">
                        <span id="fc-type-front" class="absolute top-6 left-6 text-xs font-bold text-blue-500 bg-blue-50 px-2 py-1 rounded-md">문제</span>
                        <div id="fc-front-text" class="text-4xl sm:text-5xl font-bold text-slate-800 break-keep"></div>
                    </div>
                    <!-- Back -->
                    <div class="absolute w-full h-full backface-hidden bg-gradient-to-br from-blue-600 to-purple-600 rounded-3xl shadow-inner flex flex-col items-center justify-center p-6 text-center rotate-y-180">
                        <span id="fc-type-back" class="absolute top-6 left-6 text-xs font-bold text-white/80 bg-white/20 px-2 py-1 rounded-md">정답</span>
                        <div id="fc-back-text" class="text-5xl sm:text-6xl font-bold text-white break-keep"></div>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-between gap-4">
                <button onclick="app.prevCard()" class="w-14 h-14 rounded-full bg-white text-slate-600 shadow-md hover:bg-slate-50 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-chevron-left text-xl"></i>
                </button>

                <div class="flex-grow flex gap-3">
                    <button onclick="app.markCard(false)" class="flex-1 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-4 rounded-2xl shadow-sm border border-rose-200 transition-all flex flex-col items-center justify-center gap-1 active:scale-95">
                        <i class="fa-regular fa-face-frown text-2xl"></i>
                        <span class="text-sm">몰라요</span>
                    </button>
                    <button onclick="app.markCard(true)" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 font-bold py-4 rounded-2xl shadow-sm border border-emerald-200 transition-all flex flex-col items-center justify-center gap-1 active:scale-95">
                        <i class="fa-regular fa-face-smile text-2xl"></i>
                        <span class="text-sm">알아요</span>
                    </button>
                </div>

                <button onclick="app.nextCard()" class="w-14 h-14 rounded-full bg-white text-slate-600 shadow-md hover:bg-slate-50 flex items-center justify-center transition-colors">
                    <i class="fa-solid fa-chevron-right text-xl"></i>
                </button>
            </div>
            <div class="text-center mt-6 text-xs text-slate-400">
                스페이스바로 뒤집기, 방향키(←, →)로 이동할 수 있습니다.
            </div>
        </section>

        <section id="screen-test" class="screen w-full w-full max-w-md">
            <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden relative">
                <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                    <span class="text-sm font-bold text-slate-500">주관식 테스트</span>
                    <span class="text-sm font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full" id="test-progress-text">1 / 10</span>
                </div>
                
                <div class="p-6 sm:p-8 flex flex-col items-center text-center">
                    <div id="test-question-type" class="text-xs font-bold text-purple-500 bg-purple-50 px-2 py-1 rounded-md mb-4 inline-block">화학식 입력</div>
                    <div id="test-question-text" class="text-3xl sm:text-4xl font-bold text-slate-800 mb-8 break-keep min-h-[3rem]">문제</div>
                    
                    <form id="test-form" class="w-full relative" onsubmit="app.submitTestAnswer(event)">
                        <input type="text" id="test-input" class="w-full text-center text-2xl font-bold p-4 border-2 border-slate-200 rounded-xl focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 outline-none transition-all" 
                               autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="정답을 입력하세요">
                        <p class="text-xs text-slate-400 mt-2 text-left px-1">* 대소문자를 구분해서 입력하세요 (숫자/기호는 자동으로 위·아래첨자로 변환됩니다)</p>
                        
                        <button type="submit" id="btn-submit-test" class="mt-6 w-full bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all text-lg">
                            제출하기
                        </button>
                    </form>

                    <!-- Feedback Area (Hidden by default) -->
                    <div id="test-feedback" class="w-full mt-6 hidden fade-in text-left">
                        <div id="feedback-box" class="p-4 rounded-xl border-2 flex items-start gap-3">
                            <div id="feedback-icon" class="text-2xl mt-0.5"></div>
                            <div class="flex-grow">
                                <h4 id="feedback-title" class="font-bold text-lg mb-1">정답입니다!</h4>
                                <p id="feedback-detail" class="text-sm font-medium"></p>
                            </div>
                        </div>
                        <button id="btn-next-test" onclick="app.nextTestQuestion()" class="mt-4 w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow-md transition-all">
                            다음 문제
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="screen-result" class="screen w-full w-full max-w-md">
            <div class="bg-white rounded-3xl shadow-xl border border-slate-100 overflow-hidden flex flex-col h-[80vh] max-h-[600px]">
                <div class="p-6 sm:p-8 border-b border-slate-100 text-center bg-gradient-to-br from-blue-50 to-purple-50">
                    <div class="w-20 h-20 bg-white rounded-full flex items-center justify-center mx-auto mb-4 shadow-md text-3xl">
                        <span id="result-emoji">🎉</span>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">학습 완료!</h2>
                    <div class="text-sm font-medium text-slate-500 mb-4" id="result-subtitle">테스트 결과를 확인하세요</div>
                    
                    <div id="score-display" class="hidden text-4xl font-black text-blue-600 mb-2">
                        <span id="score-correct">0</span> <span class="text-xl text-slate-400 font-bold">/ <span id="score-total">0</span></span>
                    </div>
                </div>

                <div class="flex-grow overflow-y-auto p-4 sm:p-6 bg-slate-50">
                    <h3 class="text-sm font-bold text-slate-700 mb-3" id="result-list-title">틀린 문제 목록</h3>
                    <ul id="mistakes-list" class="space-y-3">
                        <!-- Mistakes will be injected here -->
                    </ul>
                    <div id="perfect-message" class="hidden text-center py-8 text-emerald-600 font-bold flex flex-col items-center">
                        <i class="fa-solid fa-award text-4xl mb-2"></i>
                        모두 맞췄습니다! 완벽해요!
                    </div>
                </div>

                <div class="p-4 sm:p-6 bg-white border-t border-slate-100 flex gap-3">
                    <button onclick="app.goHome()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 rounded-xl transition-all text-sm">
                        홈으로
                    </button>
                    <button id="btn-retry-mistakes" onclick="app.start(app.currentMode, true)" class="flex-[2] bg-gradient-to-r from-rose-500 to-rose-600 hover:from-rose-600 hover:to-rose-700 text-white font-bold py-3.5 rounded-xl shadow-md transition-all text-sm hidden">
                        틀린 것만 재학습
                    </button>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Data Configuration
        const RAW_DATA = {
            elements: [
                { ko: '수소', symbol: 'H' },
                { ko: '리튬', symbol: 'Li' },
                { ko: '탄소', symbol: 'C' },
                { ko: '질소', symbol: 'N' },
                { ko: '산소', symbol: 'O' },
                { ko: '나트륨', symbol: 'Na' },
                { ko: '마그네슘', symbol: 'Mg' },
                { ko: '알루미늄', symbol: 'Al' },
                { ko: '황', symbol: 'S' },
                { ko: '염소', symbol: 'Cl' },
                { ko: '칼슘', symbol: 'Ca' },
                { ko: '칼륨', symbol: 'K' },
                { ko: '구리', symbol: 'Cu' },
                { ko: '은', symbol: 'Ag' },
                { ko: '질산 이온', symbol: 'NO₃⁻' },
                { ko: '탄산 이온', symbol: 'CO₃²⁻' }
            ],
            formulas: [
                { ko: '수소(기체)', symbol: 'H₂' },
                { ko: '산소(기체)', symbol: 'O₂' },
                { ko: '질소(기체)', symbol: 'N₂' },
                { ko: '이산화 탄소', symbol: 'CO₂' },
                { ko: '이산화 질소', symbol: 'NO₂' },
                { ko: '염화 칼슘', symbol: 'CaCl₂' },
                { ko: '탄산 칼슘', symbol: 'CaCO₃' },
                { ko: '염화 나트륨', symbol: 'NaCl' },
                { ko: '물', symbol: 'H₂O' },
                { ko: '염산', symbol: 'HCl' },
                { ko: '암모니아', symbol: 'NH₃' },
                { ko: '메테인', symbol: 'CH₄' },
                { ko: '산화 구리', symbol: 'CuO' },
                { ko: '산화 마그네슘', symbol: 'MgO' },
                { ko: '염화 마그네슘', symbol: 'MgCl₂' },
                { ko: '질산은', symbol: 'AgNO₃' }
            ]
        };

        const utils = {
            shuffle: (array) => {
                let currentIndex = array.length, randomIndex;
                while (currentIndex > 0) {
                    randomIndex = Math.floor(Math.random() * currentIndex);
                    currentIndex--;
                    [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
                }
                return array;
            },
            
            // Convert standard typed text (e.g. H2O, CO32-) to compare with Unicode sub/superscripts
            normalizeFormula: (str) => {
                const map = { 
                    '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4',
                    '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9',
                    '⁻': '-', '²': '2', '³': '3', '⁺': '+' 
                };
                let normalized = str;
                for (const [key, value] of Object.entries(map)) {
                    normalized = normalized.split(key).join(value);
                }
                return normalized.trim();
            },

            // Convert raw input into chemical formula formatting dynamically
            formatChemical: (str) => {
                let res = str;
                // Superscripts (charges)
                res = res.replace(/2-/g, '²⁻');
                res = res.replace(/3-/g, '³⁻');
                res = res.replace(/2\+/g, '²⁺');
                res = res.replace(/-/g, '⁻');
                res = res.replace(/\+/g, '⁺');
                
                // Subscripts (remaining numbers)
                const subMap = {
                    '0': '₀', '1': '₁', '2': '₂', '3': '₃', '4': '₄',
                    '5': '₅', '6': '₆', '7': '₇', '8': '₈', '9': '₉'
                };
                res = res.replace(/[0-9]/g, m => subMap[m]);
                return res;
            },
            
            normalizeKorean: (str) => {
                // Remove spaces and parenthetical parts for flexible comparison if needed, 
                // but prompt says "strict case". For Korean, we'll just strip spaces.
                return str.replace(/\s/g, '').replace(/\(.*?\)/g, '');
            },

            checkAnswer: (userAns, correctAns, isAnswerKorean) => {
                if (isAnswerKorean) {
                    return utils.normalizeKorean(userAns) === utils.normalizeKorean(correctAns);
                } else {
                    return utils.normalizeFormula(userAns) === utils.normalizeFormula(correctAns);
                }
            }
        };

        const app = {
            settings: { category: 'all', direction: 'ko2en' },
            currentMode: null, // 'flashcard' | 'test'
            deck: [],
            currentIndex: 0,
            unknownItems: new Set(),
            testResults: [], // { card, isCorrect, userAnswer }
            isFlipped: false,
            
            // DOM Elements
            screens: {
                home: document.getElementById('screen-home'),
                flashcard: document.getElementById('screen-flashcard'),
                test: document.getElementById('screen-test'),
                result: document.getElementById('screen-result')
            },

            init: function() {
                this.setupEventListeners();
                this.updateHomeUI();
            },

            setupEventListeners: function() {
                // Home Configuration buttons
                document.querySelectorAll('.category-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.category-btn').forEach(b => {
                            b.classList.remove('active', 'border-blue-500', 'bg-blue-50', 'text-blue-700');
                            b.classList.add('border-slate-200', 'bg-white', 'text-slate-600');
                        });
                        const target = e.currentTarget;
                        target.classList.remove('border-slate-200', 'bg-white', 'text-slate-600');
                        target.classList.add('active', 'border-blue-500', 'bg-blue-50', 'text-blue-700');
                        this.settings.category = target.dataset.value;
                    });
                });

                document.querySelectorAll('.direction-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.direction-btn').forEach(b => {
                            b.classList.remove('active', 'border-purple-500', 'bg-purple-50', 'text-purple-700');
                            b.classList.add('border-slate-200', 'bg-white', 'text-slate-600');
                        });
                        const target = e.currentTarget;
                        target.classList.remove('border-slate-200', 'bg-white', 'text-slate-600');
                        target.classList.add('active', 'border-purple-500', 'bg-purple-50', 'text-purple-700');
                        this.settings.direction = target.dataset.value;
                    });
                });

                // Global Keyboard Listeners
                document.addEventListener('keydown', (e) => {
                    if (this.currentMode === 'flashcard') {
                        if (e.code === 'Space') {
                            e.preventDefault();
                            this.flipCard();
                        } else if (e.code === 'ArrowLeft') {
                            e.preventDefault();
                            this.prevCard();
                        } else if (e.code === 'ArrowRight') {
                            e.preventDefault();
                            this.nextCard();
                        }
                    }
                });

                // Auto-format Chemical Formulas in Test Input
                document.getElementById('test-input').addEventListener('input', (e) => {
                    if (this.currentMode === 'test' && this.deck.length > 0) {
                        const card = this.deck[this.currentIndex];
                        const isKoreanAns = card.direction === 'en2ko';
                        
                        // 정답이 화학식/기호인 경우에만 자동 변환 적용
                        if (!isKoreanAns) {
                            const input = e.target;
                            const start = input.selectionStart;
                            const end = input.selectionEnd;
                            const oldVal = input.value;
                            
                            const raw = utils.normalizeFormula(oldVal);
                            const newVal = utils.formatChemical(raw);
                            
                            if (oldVal !== newVal) {
                                input.value = newVal;
                                // 커서 위치 복구 (변환 후에도 글자 수가 같아 자연스럽게 타이핑 가능)
                                input.setSelectionRange(start, end);
                            }
                        }
                    }
                });
            },

            updateHomeUI: function() {
                const btnUnknown = document.getElementById('btn-study-unknown');
                if (this.unknownItems.size > 0) {
                    btnUnknown.classList.remove('hidden');
                    btnUnknown.classList.add('flex');
                    document.getElementById('unknown-count').innerText = this.unknownItems.size;
                } else {
                    btnUnknown.classList.add('hidden');
                    btnUnknown.classList.remove('flex');
                }
            },

            showScreen: function(screenName) {
                Object.values(this.screens).forEach(s => s.classList.remove('active'));
                this.screens[screenName].classList.add('active');
                
                document.getElementById('header-controls').classList.toggle('hidden', screenName === 'home');
                document.getElementById('progress-container').classList.toggle('hidden', screenName === 'home' || screenName === 'result');
                
                if(screenName === 'home') document.getElementById('progress-bar').style.width = '0%';
            },

            buildDeck: function(useUnknownOnly) {
                let rawList = [];
                if (useUnknownOnly) {
                    rawList = Array.from(this.unknownItems);
                } else {
                    if (this.settings.category === 'element' || this.settings.category === 'all') {
                        rawList = rawList.concat(RAW_DATA.elements.map(item => ({...item, type: 'element'})));
                    }
                    if (this.settings.category === 'formula' || this.settings.category === 'all') {
                        rawList = rawList.concat(RAW_DATA.formulas.map(item => ({...item, type: 'formula'})));
                    }
                }

                let generatedDeck = rawList.map(item => {
                    let dir = this.settings.direction;
                    if (dir === 'mixed') dir = Math.random() > 0.5 ? 'ko2en' : 'en2ko';
                    
                    return {
                        original: item,
                        direction: dir,
                        front: dir === 'ko2en' ? item.ko : item.symbol,
                        back: dir === 'ko2en' ? item.symbol : item.ko,
                        frontLabel: dir === 'ko2en' ? '한글' : (item.type === 'element' ? '원소기호' : '화학식'),
                        backLabel: dir === 'ko2en' ? (item.type === 'element' ? '원소기호' : '화학식') : '한글',
                    };
                });

                return utils.shuffle(generatedDeck);
            },

            updateProgress: function() {
                const progressTextId = this.currentMode === 'flashcard' ? 'fc-progress-text' : 'test-progress-text';
                const el = document.getElementById(progressTextId);
                if (el) {
                    el.innerText = `${this.currentIndex + 1} / ${this.deck.length}`;
                }
                const pct = ((this.currentIndex + 1) / this.deck.length) * 100;
                document.getElementById('progress-bar').style.width = `${pct}%`;
            },

            start: function(mode, useUnknownOnly = false) {
                this.currentMode = mode;
                this.deck = this.buildDeck(useUnknownOnly);
                this.currentIndex = 0;
                
                if (this.deck.length === 0) {
                    alert('학습할 데이터가 없습니다.');
                    return;
                }

                if (mode === 'flashcard') {
                    this.isFlipped = false;
                    document.getElementById('flashcard-inner').classList.remove('rotate-y-180');
                    this.renderFlashcard();
                    this.showScreen('flashcard');
                } else if (mode === 'test') {
                    this.testResults = [];
                    // Reset unknown items specifically for full test? No, let's just accumulate or modify.
                    if(!useUnknownOnly) this.unknownItems.clear(); 
                    this.renderTest();
                    this.showScreen('test');
                }
            },

            renderFlashcard: function() {
                if (this.currentIndex >= this.deck.length) {
                    this.finishStudy();
                    return;
                }
                
                const card = this.deck[this.currentIndex];
                document.getElementById('fc-front-text').innerHTML = card.front;
                document.getElementById('fc-back-text').innerHTML = card.back;
                document.getElementById('fc-type-front').innerText = card.frontLabel;
                document.getElementById('fc-type-back').innerText = card.backLabel;
                
                this.isFlipped = false;
                document.getElementById('flashcard-inner').classList.remove('rotate-y-180');
                this.updateProgress();
            },

            flipCard: function() {
                this.isFlipped = !this.isFlipped;
                const inner = document.getElementById('flashcard-inner');
                if (this.isFlipped) {
                    inner.classList.add('rotate-y-180');
                } else {
                    inner.classList.remove('rotate-y-180');
                }
            },

            nextCard: function() {
                if (this.currentIndex < this.deck.length - 1) {
                    this.currentIndex++;
                    this.renderFlashcard();
                } else {
                    this.finishStudy();
                }
            },

            prevCard: function() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.renderFlashcard();
                }
            },

            markCard: function(isKnown) {
                const card = this.deck[this.currentIndex];
                if (!isKnown) {
                    this.unknownItems.add(card.original);
                } else {
                    this.unknownItems.delete(card.original);
                }
                
                // Visual feedback (small bump)
                const container = document.getElementById('flashcard-container');
                container.style.transform = 'scale(0.98)';
                setTimeout(() => container.style.transform = 'none', 100);

                setTimeout(() => {
                    this.nextCard();
                }, 150);
            },

            renderTest: function() {
                if (this.currentIndex >= this.deck.length) {
                    this.finishStudy();
                    return;
                }

                const card = this.deck[this.currentIndex];
                document.getElementById('test-question-text').innerHTML = card.front;
                document.getElementById('test-question-type').innerText = `${card.frontLabel} → ${card.backLabel} 입력`;
                
                const inputEl = document.getElementById('test-input');
                inputEl.value = '';
                inputEl.disabled = false;
                
                document.getElementById('test-form').classList.remove('hidden');
                document.getElementById('test-feedback').classList.add('hidden');
                document.getElementById('btn-submit-test').classList.remove('hidden');
                
                this.updateProgress();
                setTimeout(() => inputEl.focus(), 50);
            },

            submitTestAnswer: function(e) {
                e.preventDefault();
                const inputEl = document.getElementById('test-input');
                const userAnswer = inputEl.value.trim();
                
                if (!userAnswer) {
                    // flash red or shake
                    inputEl.classList.add('border-rose-500');
                    setTimeout(() => inputEl.classList.remove('border-rose-500'), 500);
                    return;
                }

                const card = this.deck[this.currentIndex];
                const isKoreanAns = card.direction === 'en2ko';
                
                const isCorrect = utils.checkAnswer(userAnswer, card.back, isKoreanAns);
                
                if (!isCorrect) {
                    this.unknownItems.add(card.original);
                } else {
                    this.unknownItems.delete(card.original);
                }

                this.testResults.push({
                    card: card,
                    isCorrect: isCorrect,
                    userAnswer: userAnswer
                });

                this.showTestFeedback(isCorrect, card.back);
            },

            showTestFeedback: function(isCorrect, correctAnswer) {
                document.getElementById('test-input').disabled = true;
                document.getElementById('btn-submit-test').classList.add('hidden');
                
                const feedbackEl = document.getElementById('test-feedback');
                const box = document.getElementById('feedback-box');
                const icon = document.getElementById('feedback-icon');
                const title = document.getElementById('feedback-title');
                const detail = document.getElementById('feedback-detail');

                feedbackEl.classList.remove('hidden');

                if (isCorrect) {
                    box.className = 'p-4 rounded-xl border-2 border-emerald-200 bg-emerald-50 flex items-start gap-3';
                    icon.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-500"></i>';
                    title.innerText = '정답입니다!';
                    title.className = 'font-bold text-lg mb-1 text-emerald-700';
                    detail.innerText = '잘하셨어요.';
                    detail.className = 'text-sm font-medium text-emerald-600';
                } else {
                    box.className = 'p-4 rounded-xl border-2 border-rose-200 bg-rose-50 flex items-start gap-3';
                    icon.innerHTML = '<i class="fa-solid fa-circle-xmark text-rose-500"></i>';
                    title.innerText = '오답입니다!';
                    title.className = 'font-bold text-lg mb-1 text-rose-700';
                    detail.innerHTML = `정답은 <span class="text-rose-600 font-bold text-lg mx-1">${correctAnswer}</span> 입니다.`;
                    detail.className = 'text-sm font-medium text-rose-600';
                }

                const btnNext = document.getElementById('btn-next-test');
                btnNext.className = isCorrect 
                    ? 'mt-4 w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-4 rounded-xl shadow-md transition-all'
                    : 'mt-4 w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-4 rounded-xl shadow-md transition-all';
                
                setTimeout(() => btnNext.focus(), 50);
            },

            nextTestQuestion: function() {
                this.currentIndex++;
                this.renderTest();
            },

            finishStudy: function() {
                this.showScreen('result');
                const isTest = this.currentMode === 'test';
                
                document.getElementById('score-display').classList.toggle('hidden', !isTest);
                document.getElementById('result-subtitle').innerText = isTest ? '주관식 테스트 결과' : '플래시카드 학습 완료';
                
                const listTitle = document.getElementById('result-list-title');
                const mistakesList = document.getElementById('mistakes-list');
                const perfectMsg = document.getElementById('perfect-message');
                const btnRetry = document.getElementById('btn-retry-mistakes');
                
                mistakesList.innerHTML = '';
                
                let mistakes = [];
                if (isTest) {
                    mistakes = this.testResults.filter(r => !r.isCorrect).map(r => r.card);
                    document.getElementById('score-correct').innerText = this.testResults.length - mistakes.length;
                    document.getElementById('score-total').innerText = this.testResults.length;
                    
                    const ratio = (this.testResults.length - mistakes.length) / this.testResults.length;
                    document.getElementById('result-emoji').innerText = ratio === 1 ? '🏆' : (ratio > 0.7 ? '👏' : '💪');
                } else {
                    // For flashcards, mistakes are just what's currently in unknownItems from this session
                    // We'll just display everything in the unknown set for simplicity
                    mistakes = Array.from(this.unknownItems).map(item => ({
                        front: item.ko,
                        back: item.symbol,
                        frontLabel: '한글',
                        backLabel: item.type === 'element' ? '원소기호' : '화학식'
                    }));
                    document.getElementById('result-emoji').innerText = mistakes.length === 0 ? '✨' : '📚';
                }

                if (mistakes.length === 0) {
                    listTitle.classList.add('hidden');
                    mistakesList.classList.add('hidden');
                    perfectMsg.classList.remove('hidden');
                    btnRetry.classList.add('hidden');
                } else {
                    listTitle.classList.remove('hidden');
                    listTitle.innerText = isTest ? '틀린 문제 확인하기' : '모르는 단어 확인하기';
                    mistakesList.classList.remove('hidden');
                    perfectMsg.classList.add('hidden');
                    btnRetry.classList.remove('hidden');
                    
                    if (!isTest) {
                        btnRetry.innerText = '모르는 단어만 재학습';
                    } else {
                        btnRetry.innerText = '틀린 문제만 재학습';
                    }

                    mistakes.forEach(card => {
                        const li = document.createElement('li');
                        li.className = 'bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between';
                        
                        const left = document.createElement('div');
                        left.className = 'font-semibold text-slate-800';
                        left.innerText = card.front;
                        
                        const right = document.createElement('div');
                        right.className = 'font-bold text-blue-600 text-lg';
                        right.innerText = card.back;
                        
                        li.appendChild(left);
                        li.appendChild(right);
                        mistakesList.appendChild(li);
                    });
                }
                
                this.updateHomeUI(); // Update count for home screen
            },

            goHome: function() {
                this.currentMode = null;
                this.updateHomeUI();
                this.showScreen('home');
            }
        };

        // Initialize application
        window.addEventListener('DOMContentLoaded', () => {
            app.init();
        });

    </script>
</body>
</html>
